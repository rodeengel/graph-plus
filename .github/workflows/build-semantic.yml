name: Build semantic test package

on:
  push:
    branches:
      - feature/semantic-links
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/semantic-links
          fetch-depth: 0

      - name: Reassemble semantic source
        run: |
          cat .semantic/chunk-* > semantic-src.b64
          base64 --decode semantic-src.b64 > semantic-src-clean.tar.gz
          tar -xzf semantic-src-clean.tar.gz
          rm -f semantic-src.b64 semantic-src-clean.tar.gz semantic-src.tar.gz
          rm -rf .semantic

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production plugin
        run: npm run build

      - name: Verify Obsidian package
        run: |
          test -s main.js
          test -s manifest.json
          test -s styles.css
          grep -q '"id": "graph-plus-semantic"' manifest.json

      - name: Commit source and compiled plugin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add semantic relationship styling and physics"
          git push

      - name: Stage installable plugin
        run: |
          mkdir -p dist/graph-plus-semantic
          cp main.js manifest.json styles.css dist/graph-plus-semantic/

      - uses: actions/upload-artifact@v4
        with:
          name: graph-plus-semantic
          path: dist/graph-plus-semantic
